experiment:
  name: swm_stage1_square
  seed: 42
  output_dir: outputs/stage1/square

data:
  dataset: mimicgen
  task: square
  data_root: /NHNHOME/WORKSPACE/0526040052_A/sjLee/WMPO-JEPA/data
  image_size: 224
  num_workers: 4
  train_split: 0.9

encoder:
  vjepa2_ckpt: /home/dgist_shyo/.cache/torch/hub/checkpoints/vjepa2-ac-vitg.pt           # V-JEPA-2 checkpoint 경로. null이면 random init
  freeze_backbone: true      # backbone freeze, heads만 학습
  latent_dim: 1408
  max_nodes: 8                # square=2, stack_three=3, three_piece=3

heads:
  graph_head:
    hidden_dims: [768, 384]
    dropout: 0.1
  depth_head:
    grid_size: 32
    hidden_dims: [768, 384]
    dropout: 0.1

loss:
  lambda_graph: 1.0
  lambda_depth: 0.5
  graph_loss: smooth_l1
  depth_loss: smooth_l1

training:
  epochs: 50
  batch_size: 32
  lr: 1.0e-4
  lr_backbone: 1.0e-5
  weight_decay: 1.0e-4
  warmup_epochs: 5
  scheduler: cosine
  grad_clip: 1.0
  amp: true
  log_interval: 50
  save_interval: 5
