# Stage 2-B: Multi-step unrolled loss only (DAgger 없음)
# B 완료 후 → stage2_robust_c.yaml 로 DAgger fine-tune
experiment:
  name: swm_stage2_robust_b
  seed: 42
  output_dir: outputs/stage2/robust_b

data:
  data_root: /NHNHOME/WORKSPACE/0526040052_A/sjLee/WMPO-JEPA/data
  tasks:
    - square
    - coffee
    - stack_three
    - three_piece_assembly
  image_size: 224
  num_workers: 4
  train_split: 0.9
  seq_len: 16

stage1_ckpt: outputs/stage1/multitask_dinosiglip/best.pt

encoder:
  latent_dim: 2176
  spatial_dim: 256
  vla_path: /NHNHOME/WORKSPACE/0526040052_A/sjLee/WMPO/checkpoint_files/SFT_models/square

transition:
  use_spatial: true
  spatial_dim: 256
  action_dim: 7
  hidden_dim: 512
  num_layers: 6
  num_heads: 8
  dropout: 0.1

loss:
  lambda_jepa: 1.0
  jepa_loss: l1

training:
  epochs: 100
  batch_size: 512
  lr: 3.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
  amp: true
  log_interval: 100
  save_interval: 5

  multistep_k: 8
  multistep_decay: 0.7

  dagger_prob_start: 0.0
  dagger_prob_end: 0.0       # DAgger 비활성화
  dagger_warmup_epochs: 1

  teacher_forcing:
    initial_ratio: 1.0
    final_ratio: 0.5
    decay_epochs: 30
  noise_injection:
    enabled: true
    std: 0.01
