# Direction 1: PCA binary phase reward (Spatial SWM)
# 각 goal의 progress > threshold → 1, else 0  →  {0, 0.25, 0.5, 0.75, 1.0}
# within-group reward variance 극대화
experiment:
  name: swm_stage3_spatial_pca_binary_delta_square
  seed: 42
  output_dir: outputs/stage3/spatial_pca_binary_delta/square

task: square
unnorm_key: square_d0_300_demos

reward_type: latent
reward_metric: pca_cosine
pca_components: 16
n_goals: 4
phase_threshold: 0.3       # progress_k > 0.3 → 1.0, else 0.0
reward_aggregation: mean   # mean of binary per-goal rewards

vla_path: /NHNHOME/WORKSPACE/0526040052_A/sjLee/WMPO/checkpoint_files/SFT_models/square
swm_ckpt: outputs/stage2/spatial_multitask/best.pt
stage1_ckpt: outputs/stage1/multitask_dinosiglip/best.pt

data_root: /NHNHOME/WORKSPACE/0526040052_A/sjLee/WMPO-JEPA/data

training:
  iterations: 200
  max_demos: 300
  n_states_per_iter: 4
  g_rollouts: 8
  mini_g: 2
  n_rollout_chunks: 20
  temperature: 1.2
  full_finetune: false
  freeze_projector: true
  gradient_checkpointing: false
  lr: 5.0e-6
  clip_eps: 0.2
  kl_coef: 0.05
  grad_clip: 1.0
  log_every: 1
  save_every: 20
patch_weight_method: delta
patch_weight_top_k: 64
