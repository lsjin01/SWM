# Spatial SWM: PCA-adaptive multi-goal
# 고정 4개 goal(시간 기반) 대신 PCA progress threshold 초과 시 goal 자동 생성
# → demo마다 가변 개수 goal, temporal이 아닌 의미론적 phase 기반
experiment:
  name: swm_stage3_spatial_pca_multi_goal_square
  seed: 42
  output_dir: outputs/stage3/spatial_pca_multi_goal/square

task: square
unnorm_key: square_d0_300_demos

reward_type: latent
reward_metric: pca_cosine
pca_components: 16
n_goals: pca_adaptive         # PCA progress 기반 동적 goal 생성
pca_goal_threshold: 0.3       # progress가 0.3 이상 올라갈 때마다 goal 생성 (~3-4개)
phase_threshold: 0.3          # per-goal binary: progress > 0.3 → 1.0
reward_aggregation: mean

vla_path: /NHNHOME/WORKSPACE/0526040052_A/sjLee/WMPO/checkpoint_files/SFT_models/square
swm_ckpt: outputs/stage2/spatial_multitask/best.pt
stage1_ckpt: outputs/stage1/multitask_dinosiglip/best.pt

data_root: /NHNHOME/WORKSPACE/0526040052_A/sjLee/WMPO-JEPA/data

training:
  iterations: 200
  max_demos: 300
  n_states_per_iter: 4
  g_rollouts: 8
  mini_g: 2
  n_rollout_chunks: 20
  temperature: 1.2
  full_finetune: false
  freeze_projector: true
  gradient_checkpointing: false
  lr: 5.0e-6
  clip_eps: 0.2
  kl_coef: 0.05
  grad_clip: 1.0
  log_every: 1
  save_every: 20
