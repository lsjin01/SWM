# Stage 3 — Transition-space L2 Reward
#
# 핵심 아이디어:
#   z_goal = transition(z_0, demo_actions[:64])   ← transition 공간의 goal
#   z_T    = transition(z_0, policy_actions[:64]) ← transition 공간의 policy 결과
#   reward = -||z_T - z_goal||_2
#
# encoder vs transition 분포 불일치 없음:
#   이전 cosine latent: z_goal=encoder, z_T=transition → 공간 불일치 → saturation
#   이전 graph reward : z_T→graph_head→pos, 추가 근사 오차
#   이 방식: 두 latent 모두 transition 공간 → apples-to-apples 비교
#
# rollout_steps = n_rollout_chunks × NUM_ACTIONS_CHUNK = 8 × 8 = 64

experiment:
  name: swm_stage3_tl2_square
  seed: 42
  output_dir: outputs/stage3/vs_p128_tl2/square

task: square
unnorm_key: square_d0_300_demos

reward_type: transition_l2

vla_path: /NHNHOME/WORKSPACE/0526040052_A/sjLee/WMPO/checkpoint_files/SFT_models/square
swm_ckpt: outputs/stage2/multitask_dinosiglip/best.pt
stage1_ckpt: outputs/stage1/multitask_dinosiglip/best.pt

data_root: /NHNHOME/WORKSPACE/0526040052_A/sjLee/WMPO-JEPA/data

training:
  iterations: 100
  max_demos: 300
  n_states_per_iter: 2
  g_rollouts: 4
  mini_g: 1
  n_rollout_chunks: 8
  temperature: 1.6
  full_finetune: true
  gradient_checkpointing: true
  lr: 5.0e-6
  clip_eps: 0.2
  kl_coef: 0.0
  grad_clip: 1.0
  log_every: 1
  save_every: 20
