# configs/stage2.yaml
# Stage 2: Transition Training

experiment:
  name: swm_stage2
  seed: 42
  output_dir: outputs/stage2

data:
  dataset: mimicgen
  task: square
  data_root: data/mimicgen
  image_size: 224
  num_workers: 4
  train_split: 0.9
  # Sequence sampling
  seq_len: 16                  # number of (z_t, a_t, z_t+1) pairs per sample

stage1_ckpt: outputs/stage1/best.pt   # frozen Encoder + Heads

transition:
  backbone: vjepa2_ac          # vjepa2_ac | transformer | mlp
  vjepa2_ac_ckpt: checkpoints/vjepa2_ac/predictor.pt
  freeze_vjepa2_ac: false      # fine-tune predictor
  input_dim: 1408              # must match encoder embed_dim
  action_dim: 7                # robot action dimensionality
  hidden_dim: 1024
  num_layers: 6
  num_heads: 8
  dropout: 0.1

loss:
  # Structured prediction losses (via frozen decoder heads)
  lambda_graph: 1.0
  lambda_depth: 0.5
  # JEPA loss: predicted latent vs real next-frame latent
  lambda_jepa: 1.0
  jepa_loss: l1                # l1 | l2 | cosine

training:
  epochs: 50
  batch_size: 16
  lr: 5.0e-5
  weight_decay: 1.0e-4
  warmup_epochs: 3
  scheduler: cosine
  grad_clip: 1.0
  amp: true
  log_interval: 50
  save_interval: 5

  # Teacher Forcing schedule
  teacher_forcing:
    initial_ratio: 1.0         # start fully supervised
    final_ratio: 0.5           # decay to 50% by end of training
    decay_epochs: 30           # epochs over which to decay

  # Noise Injection
  noise_injection:
    enabled: true
    std: 0.01                  # Gaussian noise std on input latent
