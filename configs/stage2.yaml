experiment:
  name: swm_stage2_square
  seed: 42
  output_dir: outputs/stage2/square

data:
  dataset: mimicgen
  task: square
  data_root: /NHNHOME/WORKSPACE/0526040052_A/sjLee/WMPO-JEPA/data
  image_size: 224
  num_workers: 4
  train_split: 0.9
  seq_len: 16

stage1_ckpt: outputs/stage1/square/best.pt

encoder:
  latent_dim: 1408

transition:
  vjepa2_ac_ckpt: /home/dgist_shyo/.cache/torch/hub/checkpoints/vjepa2-ac-vitg.pt        # V-JEPA-2-AC checkpoint. null이면 random init
  freeze_vjepa2_ac: false
  action_dim: 7
  hidden_dim: 1024
  num_layers: 6
  num_heads: 8
  dropout: 0.1

loss:
  lambda_graph: 1.0
  lambda_depth: 0.5
  lambda_jepa: 1.0
  jepa_loss: l1

training:
  epochs: 50
  batch_size: 16
  lr: 5.0e-5
  weight_decay: 1.0e-4
  grad_clip: 1.0
  amp: true
  log_interval: 50
  save_interval: 5

  teacher_forcing:
    initial_ratio: 1.0
    final_ratio: 0.5
    decay_epochs: 30

  noise_injection:
    enabled: true
    std: 0.01
