# Mean-pool SWM: PCA-adaptive multi-goal (non-spatial 비교용)
# 기존 stage3_pca_goal(n_goals=4 fixed) 대비 adaptive goal 효과 측정
experiment:
  name: swm_stage3_pca_multi_goal_square
  seed: 42
  output_dir: outputs/stage3/pca_multi_goal/square

task: square
unnorm_key: square_d0_300_demos

reward_type: latent
reward_metric: pca_cosine
pca_components: 16
n_goals: pca_adaptive
pca_goal_threshold: 0.3
phase_threshold: 0.3
reward_aggregation: mean

vla_path: /NHNHOME/WORKSPACE/0526040052_A/sjLee/WMPO/checkpoint_files/SFT_models/square
swm_ckpt: outputs/stage2/multitask_dinosiglip/best.pt
stage1_ckpt: outputs/stage1/multitask_dinosiglip/best.pt

data_root: /NHNHOME/WORKSPACE/0526040052_A/sjLee/WMPO-JEPA/data

training:
  iterations: 200
  max_demos: 300
  n_states_per_iter: 4
  g_rollouts: 8
  mini_g: 2
  n_rollout_chunks: 20
  temperature: 1.2
  full_finetune: false
  freeze_projector: true
  gradient_checkpointing: false
  lr: 5.0e-6
  clip_eps: 0.2
  kl_coef: 0.05
  grad_clip: 1.0
  log_every: 1
  save_every: 20
